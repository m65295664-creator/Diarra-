
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIARRA CONNECT</title>
<script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#071b2b;color:white;font-family:Arial;padding:10px}
header{text-align:center;padding:20px}
.logo{font-size:28px;font-weight:bold;color:#00ff88}
.card{background:#0e2a44;padding:20px;border-radius:15px;margin:15px 0}
input,button{width:100%;padding:15px;margin:8px 0;border-radius:10px;border:none;font-size:16px}
button{background:#00ff88;color:#000;font-weight:bold}
button.search{background:#0088ff;color:white}
#logs{background:#000;color:#0f0;padding:10px;height:100px;overflow:auto;border-radius:10px;font-size:12px}
.result{background:#123456;padding:10px;margin:5px 0;border-radius:8px}
</style>
</head>
<body>
<header>
<div class="logo">📞 DIARRA CONNECT</div>
<p>Base: diarra-connect</p>
<p>Votre ID: <span id="myId">Connexion...</span></p>
</header>

<div class="card">
<h3>📞 Passer un appel</h3>
<input id="nom" placeholder="Nom de l'appelant">
<input id="numeroAppel" placeholder="ID ou Numéro à appeler">
<button onclick="passerAppel()">📞 APPELER</button>
<button onclick="repondreAppel()" id="btnRepondre" style="display:none;background:orange">📥 REPONDRE</button>
</div>

<div class="card">
<h3>🔍 Rechercher dans la base</h3>
<input id="searchInput" placeholder="Tape nom ou numéro à chercher">
<button class="search" onclick="chercherAppels()">🔍 RECHERCHER</button>
<button onclick="voirTous()" style="background:#555;color:white">Voir tous les appels</button>
<div id="resultats"></div>
</div>

<div class="card">
<h3>Journal</h3>
<div id="logs">Prêt...</div>
</div>
<audio id="remoteAudio" autoplay></audio>

<script>
const SUPABASE_URL="https://nwmpmraheimpakvaczix.supabase.co";
const SUPABASE_KEY="sb_publishable_dk__FiRU-cyZ8Z9jdTi2rQ_n_XTz6ix";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function log(m){let d=document.getElementById('logs'); d.innerHTML+=new Date().toLocaleTimeString()+" - "+m+"<br>";}
const peer=new Peer();
let curCall=null;
peer.on('open',id=>{document.getElementById('myId').innerText=id; log("Connecté: "+id);});
peer.on('call',call=>{
  curCall=call;
  document.getElementById('btnRepondre').style.display='block';
  log("Appel entrant: "+call.peer);
  enregistrerAppel("Entrant",call.peer);
});
async function enregistrerAppel(nom,numero){
  log("Enregistrement "+numero+"...");
  const {error}=await supa.from('appels').insert([{nom:nom,numero:numero}]);
  if(error) log("Erreur DB: "+error.message);
  else log("✅ ENREGISTRE: "+numero);
}
async function passerAppel(){
  let num=document.getElementById('numeroAppel').value;
  let nom=document.getElementById('nom').value||"Client";
  if(!num){alert("Entrez numéro");return;}
  await enregistrerAppel(nom,num);
  try{
    let stream=await navigator.mediaDevices.getUserMedia({audio:true});
    let call=peer.call(num,stream);
    call.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s; log("En ligne avec "+num);});
  }catch(e){log("Erreur micro: "+e.message);}
}
async function repondreAppel(){
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  curCall.answer(stream);
  curCall.on('stream',s=>{document.getElementById('remoteAudio').srcObject=s; log("Appel répondu");});
  document.getElementById('btnRepondre').style.display='none';
}
async function chercherAppels(){
  let terme=document.getElementById('searchInput').value;
  if(!terme){alert("Tape quelque chose");return;}
  log("Recherche: "+terme);
  let {data,error}=await supa.from('appels').select('*').or(`nom.ilike.%${terme}%,numero.ilike.%${terme}%`).order('created_at',{ascending:false});
  afficherResultats(data,error);
}
async function voirTous(){
  log("Chargement...");
  let {data,error}=await supa.from('appels').select('*').order('created_at',{ascending:false}).limit(50);
  afficherResultats(data,error);
}
function afficherResultats(data,error){
  let div=document.getElementById('resultats');
  if(error){div.innerHTML="<p style='color:red'>Erreur: "+error.message+"</p>"; return;}
  if(!data||data.length==0){div.innerHTML="<p>Aucun résultat</p>"; return;}
  div.innerHTML="<h4>"+data.length+" résultats:</h4>";
  data.forEach(row=>{
    div.innerHTML+=`<div class='result'>📞 <b>${row.nom}</b> - ${row.numero}<br><small>${new Date(row.created_at).toLocaleString()}</small></div>`;
  });
}
</script>
</body>
</html>
